<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<h1>Application Form</h1>
	<form action="">
		<label for="FirstName">First Name:</label>
		<input type="text" id="FirstName">
		<label for="LastName">Last Name:</label>
		<input type="text" id="LastName">
		<br>
		<br>
		<label for="DOB">Date of birth:</label>
		<input type="date" id="DOB">
		<label for="Age">Age:</label>
		<input type="number" id="Age">
		<br>
		<br>
		<label for="Gender">Gender:</label>
		<select name="" id="Gender">
			<option value="Male">Male</option>
			<option value="Female">Female</option>
		</select>
		<label for="Email">Email Address:</label>
		<input type="email" name="" id=Email"" placeholder="Enter email address">
		<br>
		<br>
		<label for="">Positions Available:</label>
		<input type="radio" name="" id="Junior">
		<label for="Junior">Junior Developer</label>
		<input type="radio" name="" id="Mid">
		<label for="Mid">Mid-level Developer</label>
		<input type="radio" name="" id="Senior">
		<label for="Senior">Senior Developer</label>
		<br>
		<br>
		<label for="">Programming Languages:</label>
		<input type="checkbox" name="" id="Java">
		<label for="Java">Java</label>
		<input type="checkbox" name="" id="JavaScript">
		<label for="JavaScript">JavaScript</label>
		<input type="checkbox" name="" id="Python">
		<label for="Python">Python</label>
		<br>
		<br>
		<label for="Password">Password</label>
		<input type="password" name="" id="Password">
		<label for="Confirm">Confirm Password</label>
		<input type="password" name="" id="Confirm">
		<br>
		<br>
		<button type="submit">Submit</button>
		<button type="reset">Reset</button>
	</form>
</body>
</html>
